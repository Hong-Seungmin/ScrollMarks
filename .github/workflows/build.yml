name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # windows-2022 comes with the v143 toolset the project uses
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32, ARM64]
        configuration: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild ScrollMarks.vcxproj -m -p:Configuration=${{ matrix.configuration }} -p:Platform=${{ matrix.platform }}

      - name: Upload
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: ScrollMarks-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/Release/ScrollMarks.dll
            bin/${{ matrix.platform }}/Release/ScrollMarks.pdb
